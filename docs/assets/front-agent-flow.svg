<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Front-Agent 邮件处理流程</title>
  <desc id="desc">从 Front webhook 到分类、确定性路由、Skill flow、工具执行和状态记录的流程图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .box-blue { fill: #eff6ff; stroke: #93c5fd; }
      .box-green { fill: #ecfdf5; stroke: #86efac; }
      .box-orange { fill: #fff7ed; stroke: #fdba74; }
      .box-purple { fill: #f5f3ff; stroke: #c4b5fd; }
      .decision { fill: #fefce8; stroke: #fde047; stroke-width: 2; filter: url(#shadow); }
      .label { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .edge { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .lane-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; letter-spacing: 0.02em; }
      .lane { fill: none; stroke: #e2e8f0; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text class="title" x="800" y="70" text-anchor="middle">Front-Agent 邮件处理流程</text>
  <text class="subtitle" x="800" y="106" text-anchor="middle">Webhook 接入 → 上下文构建 → 分类路由 → 工具执行 → 状态记录</text>

  <rect class="lane" x="70" y="150" width="330" height="820" rx="18"/>
  <text class="lane-title" x="235" y="184" text-anchor="middle">INGESTION</text>

  <rect class="lane" x="430" y="150" width="330" height="820" rx="18"/>
  <text class="lane-title" x="595" y="184" text-anchor="middle">CONTEXT</text>

  <rect class="lane" x="790" y="150" width="330" height="820" rx="18"/>
  <text class="lane-title" x="955" y="184" text-anchor="middle">ROUTING</text>

  <rect class="lane" x="1150" y="150" width="380" height="820" rx="18"/>
  <text class="lane-title" x="1340" y="184" text-anchor="middle">EXECUTION</text>

  <g transform="translate(120 230)">
    <rect class="box box-blue" width="230" height="86" rx="14"/>
    <text class="label" x="115" y="36" text-anchor="middle">Front webhook</text>
    <text class="small" x="115" y="64" text-anchor="middle">收到客服系统事件</text>
  </g>

  <g transform="translate(120 380)">
    <rect class="box" width="230" height="94" rx="14"/>
    <text class="label" x="115" y="35" text-anchor="middle">验签 / 去重</text>
    <text class="small" x="115" y="63" text-anchor="middle">校验签名和 event_id</text>
  </g>

  <g transform="translate(120 535)">
    <rect class="box" width="230" height="104" rx="14"/>
    <text class="label" x="115" y="36" text-anchor="middle">过滤事件</text>
    <text class="small" x="115" y="64" text-anchor="middle">忽略草稿、评论</text>
    <text class="small" x="115" y="88" text-anchor="middle">和非客户入站消息</text>
  </g>

  <g transform="translate(480 270)">
    <rect class="box box-green" width="230" height="104" rx="14"/>
    <text class="label" x="115" y="36" text-anchor="middle">拉完整会话</text>
    <text class="small" x="115" y="64" text-anchor="middle">conversation messages</text>
    <text class="small" x="115" y="88" text-anchor="middle">而不是只看最新消息</text>
  </g>

  <g transform="translate(480 460)">
    <rect class="box box-green" width="230" height="104" rx="14"/>
    <text class="label" x="115" y="36" text-anchor="middle">处理附件</text>
    <text class="small" x="115" y="64" text-anchor="middle">图片给视觉模型</text>
    <text class="small" x="115" y="88" text-anchor="middle">文档提取文本</text>
  </g>

  <g transform="translate(480 650)">
    <rect class="box box-green" width="230" height="104" rx="14"/>
    <text class="label" x="115" y="36" text-anchor="middle">查状态和记忆</text>
    <text class="small" x="115" y="64" text-anchor="middle">已有 step</text>
    <text class="small" x="115" y="88" text-anchor="middle">历史 case signals</text>
  </g>

  <g transform="translate(840 300)">
    <rect class="box box-purple" width="230" height="104" rx="14"/>
    <text class="label" x="115" y="36" text-anchor="middle">LLM 分类</text>
    <text class="small" x="115" y="64" text-anchor="middle">输出 category</text>
    <text class="small" x="115" y="88" text-anchor="middle">summary / flags / evidence</text>
  </g>

  <g transform="translate(835 515)">
    <path class="decision" d="M 120 0 L 240 75 L 120 150 L 0 75 Z"/>
    <text class="label" x="120" y="65" text-anchor="middle">Python 可</text>
    <text class="label" x="120" y="94" text-anchor="middle">确定处理？</text>
  </g>

  <g transform="translate(1225 330)">
    <rect class="box box-orange" width="250" height="112" rx="14"/>
    <text class="label" x="125" y="36" text-anchor="middle">固定路由</text>
    <text class="small" x="125" y="64" text-anchor="middle">spam / legal / security</text>
    <text class="small" x="125" y="88" text-anchor="middle">business / marketing</text>
  </g>

  <g transform="translate(1225 560)">
    <rect class="box box-purple" width="250" height="112" rx="14"/>
    <text class="label" x="125" y="36" text-anchor="middle">Skill flow</text>
    <text class="small" x="125" y="64" text-anchor="middle">technical / account</text>
    <text class="small" x="125" y="88" text-anchor="middle">billing / education 等</text>
  </g>

  <g transform="translate(1225 760)">
    <rect class="box box-blue" width="250" height="112" rx="14"/>
    <text class="label" x="125" y="36" text-anchor="middle">写状态和动作日志</text>
    <text class="small" x="125" y="64" text-anchor="middle">state / action dedupe</text>
    <text class="small" x="125" y="88" text-anchor="middle">看板和人工复盘</text>
  </g>

  <path class="edge" d="M 235 316 L 235 380"/>
  <path class="edge" d="M 235 474 L 235 535"/>
  <path class="edge" d="M 350 587 L 480 322"/>
  <path class="edge" d="M 595 374 L 595 460"/>
  <path class="edge" d="M 595 564 L 595 650"/>
  <path class="edge" d="M 710 702 L 840 352"/>
  <path class="edge" d="M 955 404 L 955 515"/>
  <path class="edge" d="M 1075 590 L 1225 386"/>
  <text class="edge-label" x="1144" y="476" text-anchor="middle">能</text>
  <path class="edge" d="M 1075 590 L 1225 616"/>
  <text class="edge-label" x="1142" y="636" text-anchor="middle">不能</text>
  <path class="edge" d="M 1350 442 L 1350 760"/>
  <path class="edge" d="M 1350 672 L 1350 760"/>

  <text class="small" x="800" y="1038" text-anchor="middle">核心边界：LLM 负责理解和生成草稿；Python 负责路由、权限、副作用、状态和失败兜底。</text>
</svg>
