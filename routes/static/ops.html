<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Front-Agent Ops</title>
<style>
  :root {
    --bg:#f4f5f7; --panel:#ffffff; --sidebar:#ffffff; --line:#e3e6eb;
    --line-strong:#cfd4dc; --text:#171a21; --muted:#69707d; --soft:#f7f8fa;
    --blue:#2563eb; --blue-soft:#eef4ff; --green:#15805d; --green-soft:#eaf7f1;
    --amber:#9a5b0a; --amber-soft:#fff6e5; --red:#b42318; --red-soft:#fff0ee;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px; line-height:1.45; letter-spacing:0;
  }
  button,select,input { letter-spacing:0; }
  .shell { display:grid; grid-template-columns:208px minmax(0,1fr); min-height:100vh; }
  .sidebar {
    position:sticky; top:0; height:100vh; padding:20px 12px; background:var(--sidebar);
    border-right:1px solid var(--line);
  }
  .brand { display:flex; align-items:center; gap:10px; padding:0 8px 22px; }
  .mark {
    width:30px; height:30px; border-radius:5px; display:grid; place-items:center;
    background:#171a21; color:#fff; font-size:12px; font-weight:750;
  }
  .brand-title { font-size:14px; font-weight:700; }
  .brand-sub { color:var(--muted); font-size:11px; margin-top:1px; }
  .nav { display:grid; gap:2px; }
  .nav button {
    width:100%; min-height:38px; padding:9px 10px; border:0; border-left:2px solid transparent;
    border-radius:4px; background:transparent; color:#4c5360; cursor:pointer; text-align:left; font:inherit;
  }
  .nav button:hover { background:var(--soft); color:var(--text); }
  .nav button.active { border-left-color:var(--blue); background:var(--blue-soft); color:#1749aa; font-weight:650; }
  .main { min-width:0; width:100%; max-width:1540px; padding:24px 30px 40px; }
  .topbar {
    min-height:54px; margin-bottom:18px; display:flex; align-items:flex-start;
    justify-content:space-between; gap:18px;
  }
  h1 { margin:0; font-size:21px; line-height:1.25; font-weight:700; }
  .meta { margin-top:5px; color:var(--muted); font-size:12px; }
  .actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .service-state { display:inline-flex; align-items:center; gap:7px; min-height:32px; color:#444b57; font-size:12px; }
  .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
  .status-dot.bad { background:var(--red); }
  .scheduler-state { color:var(--muted); font-size:12px; padding:0 4px; }
  .button,.toggle button {
    min-height:32px; padding:6px 11px; border:1px solid var(--line-strong); border-radius:5px;
    background:var(--panel); color:#343a46; cursor:pointer; font:inherit; font-weight:560;
  }
  .button:hover,.toggle button:hover { border-color:#aeb5c0; background:var(--soft); }
  .button.compact { min-height:28px; padding:4px 8px; font-size:12px; }
  .button.danger { color:var(--red); border-color:#e7aaa4; background:#fff; }
  .button.danger:hover { background:var(--red-soft); }
  .toggle { display:inline-flex; gap:2px; padding:3px; border:1px solid var(--line); border-radius:6px; background:var(--soft); }
  .toggle button { border-color:transparent; background:transparent; min-height:28px; padding:4px 10px; }
  .toggle button.active { border-color:var(--line-strong); background:#fff; color:#1749aa; }
  .view { display:none; }
  .view.active { display:block; }
  .stack { display:grid; gap:14px; }
  .panel { min-width:0; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  .panel-head {
    min-height:54px; padding:13px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .panel-title { font-size:14px; font-weight:680; }
  .panel-sub { margin-top:2px; color:var(--muted); font-size:12px; }
  .panel-body { padding:14px 16px 16px; }
  .kpi-strip {
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden;
  }
  .metric { min-width:0; min-height:98px; padding:15px 17px; border-right:1px solid var(--line); }
  .metric:last-child { border-right:0; }
  .metric-label { color:var(--muted); font-size:12px; font-weight:600; }
  .metric-value { margin-top:8px; font-size:26px; line-height:1.05; font-weight:720; font-variant-numeric:tabular-nums; }
  .metric-note { margin-top:7px; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .overview-secondary { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:720px; }
  th,td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { background:#fafbfc; color:var(--muted); font-size:11px; font-weight:650; text-transform:uppercase; }
  tbody tr:hover { background:#fafbfc; }
  tr:last-child td { border-bottom:0; }
  .priority-table { min-width:760px; table-layout:fixed; }
  .priority-table th:nth-child(1) { width:23%; }
  .priority-table th:nth-child(2) { width:49%; }
  .priority-table th:nth-child(3) { width:17%; }
  .priority-table th:nth-child(4) { width:11%; }
  .cell-title { font-weight:620; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cell-sub { margin-top:3px; color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .id-link { color:#1d55bd; text-decoration:none; font-weight:630; }
  .id-link:hover { text-decoration:underline; }
  .muted { color:var(--muted); }
  .clip { max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge {
    display:inline-flex; align-items:center; min-height:21px; padding:2px 7px; border-radius:999px;
    background:#f0f2f5; color:#515967; font-size:11px; font-weight:620; white-space:nowrap;
  }
  .badge.ok { background:var(--green-soft); color:var(--green); }
  .badge.warn { background:var(--amber-soft); color:var(--amber); }
  .badge.bad { background:var(--red-soft); color:var(--red); }
  .badge.info,.badge.purple { background:var(--blue-soft); color:#2758ad; }
  .health-list { display:grid; }
  .health-row {
    display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px;
    min-height:42px; padding:9px 0; border-bottom:1px solid var(--line);
  }
  .health-row:last-child { border-bottom:0; }
  .health-label { color:#424955; }
  .health-value { text-align:right; font-weight:650; font-variant-numeric:tabular-nums; }
  .health-note { margin-top:3px; color:var(--muted); font-size:11px; }
  .problem-list { display:grid; gap:7px; }
  .problem-row { margin-top:8px; padding:10px; border-left:3px solid var(--red); background:var(--red-soft); }
  .coverage-block { display:grid; gap:7px; padding:5px 0 14px; }
  .coverage-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .coverage-top strong { font-variant-numeric:tabular-nums; }
  .coverage-track { height:6px; overflow:hidden; border-radius:99px; background:#eceff3; }
  .coverage-fill { height:100%; border-radius:inherit; background:var(--green); }
  .scope-note { margin-top:2px; padding-top:11px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
  .report-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--line); }
  .report-card { min-width:0; padding:14px 16px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .report-card:nth-child(3n) { border-right:0; }
  .report-card .label { color:var(--muted); font-size:11px; font-weight:600; }
  .report-card .value { margin-top:7px; font-size:22px; font-weight:720; }
  .report-card .note { margin-top:5px; color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .source-note { padding:10px 16px; color:var(--muted); font-size:11px; }
  .report-layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); gap:14px; }
  .summary-list,.action-list { margin:0; padding-left:19px; color:#3d4450; }
  .summary-list li,.action-list li { margin:7px 0; }
  .decision-list { display:grid; }
  .decision-row { padding:12px 0; border-top:1px solid var(--line); }
  .decision-row:first-child { margin-top:8px; }
  .decision-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .decision-title { font-weight:650; }
  .decision-detail { margin-top:5px; color:#4e5663; font-size:12px; }
  .examples { display:flex; gap:8px; flex-wrap:wrap; margin-top:7px; }
  .examples a { color:#1d55bd; font-size:11px; text-decoration:none; }
  .filters { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
  select,input {
    min-height:32px; padding:6px 9px; border:1px solid var(--line-strong); border-radius:5px;
    background:#fff; color:var(--text); font:inherit;
  }
  input { width:220px; }
  .missing { color:#959ca8; font-size:11px; }
  .empty { padding:30px 12px; color:var(--muted); text-align:center; }
  @media (max-width:1040px) {
    .shell { grid-template-columns:1fr; }
    .sidebar { position:static; height:auto; padding:12px 14px; border-right:0; border-bottom:1px solid var(--line); }
    .brand { padding:0 4px 12px; }
    .nav { grid-template-columns:repeat(5,minmax(0,1fr)); }
    .nav button { text-align:center; border-left:0; border-bottom:2px solid transparent; }
    .nav button.active { border-bottom-color:var(--blue); }
    .main { padding:20px; }
    .report-layout { grid-template-columns:1fr; }
  }
  @media (max-width:760px) {
    .topbar { flex-direction:column; }
    .actions { justify-content:flex-start; }
    .kpi-strip { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .metric:nth-child(2) { border-right:0; }
    .metric:nth-child(-n+2) { border-bottom:1px solid var(--line); }
    .overview-secondary,.report-layout { grid-template-columns:1fr; }
    .report-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .report-card:nth-child(3n) { border-right:1px solid var(--line); }
    .report-card:nth-child(2n) { border-right:0; }
  }
  @media (max-width:540px) {
    .main { padding:16px 12px 28px; }
    .nav { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .kpi-strip,.report-grid { grid-template-columns:1fr; }
    .metric,.metric:nth-child(2) { border-right:0; border-bottom:1px solid var(--line); }
    .metric:last-child { border-bottom:0; }
    .report-card,.report-card:nth-child(2n),.report-card:nth-child(3n) { border-right:0; }
    .filters { width:100%; }
    .filters select,.filters input,.filters .button { width:100%; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">FA</div>
      <div><div class="brand-title">Front-Agent</div><div class="brand-sub" data-i18n="brandSub"></div></div>
    </div>
    <nav class="nav">
      <button class="active" data-view="overview"><span data-i18n="navOverview"></span></button>
      <button data-view="conversations"><span data-i18n="navConversations"></span></button>
      <button data-view="reports"><span data-i18n="navReports"></span></button>
      <button data-view="actions"><span data-i18n="navActions"></span></button>
      <button data-view="sybil"><span data-i18n="navSybil"></span></button>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><h1 id="page-title"></h1><div class="meta" id="generated"></div></div>
      <div class="actions">
        <span class="service-state"><span class="status-dot" id="service-dot"></span><span id="service-status"></span></span>
        <span class="scheduler-state" id="scheduler-status"></span>
        <button class="button" id="lang-toggle"></button>
        <button class="button" id="refresh"></button>
      </div>
    </header>

    <section class="view active" id="view-overview">
      <div class="kpi-strip" id="metrics"></div>
      <div class="stack">
        <section class="panel">
          <div class="panel-head">
            <div><div class="panel-title" id="priority-title"></div><div class="panel-sub" id="priority-sub"></div></div>
            <button class="button" data-open-view="conversations" data-status="attention" data-i18n="open"></button>
          </div>
          <div class="table-wrap"><table class="priority-table" id="priority-table"></table></div>
        </section>
        <div class="overview-secondary">
          <section class="panel">
            <div class="panel-head"><div><div class="panel-title" id="automation-title"></div><div class="panel-sub" id="automation-sub"></div></div></div>
            <div class="panel-body"><div class="health-list" id="automation-health"></div><div class="problem-list" id="webhook-problems"></div></div>
          </section>
          <section class="panel">
            <div class="panel-head"><div><div class="panel-title" id="coverage-title"></div><div class="panel-sub" id="coverage-sub"></div></div></div>
            <div class="panel-body"><div id="data-health"></div><div class="scope-note" id="data-note"></div></div>
          </section>
        </div>
      </div>
    </section>

    <section class="view" id="view-conversations">
      <section class="panel">
        <div class="panel-head">
          <div><div class="panel-title" data-i18n="conversations"></div><div class="panel-sub" id="conv-count"></div></div>
          <div class="filters">
            <select id="status-filter"><option value="all" data-i18n-option="allSteps"></option><option value="attention" data-i18n-option="attention"></option><option value="failed_needs_review" data-i18n-option="failed"></option><option value="manual_review" data-i18n-option="manualReview"></option><option value="draft_created" data-i18n-option="draftCreated"></option><option value="forwarded_keep_open" data-i18n-option="forwarded"></option><option value="moved_inbox" data-i18n-option="movedInbox"></option><option value="closed_spam" data-i18n-option="closedSpam"></option></select>
            <select id="category-filter"><option value=""></option></select>
            <input id="search-filter">
            <button class="button" id="apply-filters"></button>
          </div>
        </div>
        <div class="table-wrap"><table id="conversation-table"></table></div>
      </section>
    </section>

    <section class="view" id="view-reports">
      <div class="stack">
        <section class="panel">
          <div class="panel-head">
            <div><div class="panel-title" data-i18n="generatedReport"></div><div class="panel-sub" id="report-window"></div></div>
            <div class="toggle"><button class="active" data-period="daily" data-i18n="daily"></button><button data-period="weekly" data-i18n="weekly"></button><button data-period="monthly" data-i18n="monthly"></button></div>
          </div>
          <div class="report-grid" id="report-cards"></div>
          <div class="source-note" id="report-note"></div>
        </section>
        <div class="report-layout">
          <section class="panel">
            <div class="panel-head"><div><div class="panel-title" data-i18n="analysis"></div><div class="panel-sub" data-i18n="analysisSub"></div></div></div>
            <div class="panel-body"><ul class="summary-list" id="analysis-summary"></ul><div class="decision-list" id="decision-points"></div></div>
          </section>
          <section class="panel">
            <div class="panel-head"><div><div class="panel-title" data-i18n="recommendedActions"></div><div class="panel-sub" data-i18n="recommendedActionsSub"></div></div></div>
            <div class="panel-body"><ol class="action-list" id="recommended-actions"></ol></div>
          </section>
        </div>
        <section class="panel">
          <div class="panel-head"><div><div class="panel-title" data-i18n="currentRiskList"></div><div class="panel-sub" data-i18n="currentRiskListSub"></div></div></div>
          <div class="table-wrap"><table id="report-attention-table"></table></div>
        </section>
      </div>
    </section>

    <section class="view" id="view-actions"><section class="panel"><div class="panel-head"><div><div class="panel-title" data-i18n="actionLog"></div><div class="panel-sub" id="action-count"></div></div></div><div class="table-wrap"><table id="actions-table"></table></div></section></section>
    <section class="view" id="view-sybil"><section class="panel"><div class="panel-head"><div><div class="panel-title" data-i18n="sybilQueue"></div><div class="panel-sub" id="sybil-count"></div></div></div><div class="table-wrap"><table id="sybil-table"></table></div></section></section>
  </main>
</div>
<script>
let opsWriteSecret='';const state={summary:null,report:null,conversations:[],actions:[],sybil:[],view:'overview',period:'daily',lang:localStorage.getItem('ops_lang')||'zh'};const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=value=>value?new Date(value).toLocaleString(undefined,{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';const pct=value=>`${Number(value||0).toFixed(1)}%`;

const TEXT_ZH=new Map([['Follow the commercial leads first','优先跟进商业线索'],['Reduce access and waiting friction','降低账号和等待摩擦'],['Turn repeated questions into product or docs work','把重复问题转成产品/文档动作'],['Clean up automation quality signals','清理自动化质量问题'],['Metrics come from local SQLite tables: conversation_states, conversation_actions, webhook_events, and sybil_notifications. They reflect conversations tracked by Front-Agent, not every message that may exist in Front.','指标来自本地 SQLite 表：conversation_states、conversation_actions、webhook_events 和 sybil_notifications。它们反映的是 Front-Agent 已跟踪的会话，不等于 Front 里所有消息。'],['Revenue and partnership demand','收入和合作需求'],['Business, purchase, partnership, and investment conversations indicate active commercial intent. Review these as sales or ecosystem leads, not just support workload.','Business、purchase、partnership、investment 类会话代表明确商业意图，应作为销售或生态线索跟进，而不只是客服负载。'],['Education adoption signal','教育场景采用信号'],['Education plan requests show student and institution adoption. This can inform campus growth, eligibility rules, and education onboarding content.','教育版请求反映学生和学校侧采用情况，可用于校园增长、资格规则和教育版 onboarding 内容优化。'],['Product and enterprise-readiness feedback','产品和企业级能力反馈'],['Technical, roadmap, security, and data export questions are direct product feedback. They often reveal missing docs, enterprise trust requirements, or features users expect.','technical、roadmap、security、data_export 问题是直接产品反馈，常暴露缺失文档、企业信任要求或用户期待的能力。'],['Account access friction','账号访问摩擦'],['Account, login, verification, email-change, and deletion requests are user-experience friction. They should be separated from generic support because they block product access.','账号、登录、验证、邮箱变更和删除账号请求是用户体验摩擦，应单独看待，因为它们会阻断用户进入产品。'],['Billing and plan confusion','账单和套餐理解成本'],['Billing conversations usually point to plan, invoice, downgrade, or refund confusion. These are sensitive moments that can affect retention.','账单会话通常指向套餐、发票、降级或退款困惑，这些是影响留存的敏感节点。'],['Users are stuck waiting for next information or review','用户卡在等待信息或审核'],['Awaiting states mean the support flow depends on missing user data or manual review. Long-lived awaiting states are a user-experience drag and can make automation look unresponsive.','awaiting 状态说明流程依赖用户补充信息或人工审核。长期 awaiting 会拖累体验，也会让自动化显得无响应。'],['Sender email missing in tracked state','已跟踪状态缺少 sender_email'],['Missing sender_email reduces history quality and can weaken draft recipient safety. This is a data-quality issue in the ingestion/state path, not a customer demand signal.','缺少 sender_email 会降低用户历史质量，也会削弱草稿收件人安全性。这是接入/状态写入的数据质量问题，不是客户需求信号。'],['Failed conversations need manual repair','失败会话需要人工修复'],['failed_needs_review means the handler or skill flow did not complete safely. These should be reviewed before judging automation quality from aggregate numbers.','failed_needs_review 表示 handler 或 skill flow 没有安全完成。评估自动化质量前，应先处理这些失败项。'],['Sybil handoffs pending','Sybil handoff 待发送'],['Pending Sybil notifications mean education handoffs are queued but not yet sent or cleared. This is expected before digest time, but should not accumulate.','pending Sybil 通知表示教育版 handoff 已排队但尚未发送或清理。digest 时间前这是正常的，但不应长期堆积。'],['Create a weekly lead review for business, purchase, partnership, and investment categories with Front links and owner assignment.','建立每周线索 review：覆盖 business、purchase、partnership、investment 分类，带 Front 链接和负责人。'],['Track education requests by school/domain and convert repeated schools into onboarding or campus ambassador opportunities.','按学校/domain 跟踪教育版请求，把重复出现的学校转为 onboarding 或校园推广机会。'],['Review technical and roadmap questions weekly with product/docs owners and convert repeated asks into docs or roadmap evidence.','每周和产品/文档负责人 review technical 与 roadmap 问题，把重复问题转成文档或 roadmap 证据。'],['Break down account issues by subtype and fix the top blocker first, especially verification-code and identity-verification flows.','按 subtype 拆解账号问题，优先修复最大阻塞，尤其是验证码和身份验证流程。'],['Turn repeated billing and downgrade cases into clearer in-product copy and billing help-center entries.','把重复账单/降级案例转成更清晰的产品内文案和账单帮助文档。'],['Add a stale-awaiting review habit and improve prompts that ask users for missing information.','建立 stale awaiting review 习惯，并优化向用户索取缺失信息的提示。'],['Audit why sender_email is blank for recent conversations and preserve it whenever Front provides the original sender.','排查近期会话 sender_email 为空的原因，并在 Front 提供原始发件人时稳定保存。'],['Clear failed_needs_review daily and capture root cause as either routing bug, skill gap, or external API failure.','每天清理 failed_needs_review，并记录根因：路由 bug、skill 缺口或外部 API 失败。']]);
function t(key){return I18N[state.lang][key]||I18N.en[key]||key;}function trText(text){if(state.lang==='en')return text||'';return TEXT_ZH.get(text)||translateDynamic(text||'');}function translateDynamic(text){let m=text.match(/^(\d+) tracked conversations changed in this window; (\d+) currently need attention\.$/);if(m)return`该窗口内 ${m[1]} 个已跟踪会话发生变化；当前 ${m[2]} 个需要处理。`;m=text.match(/^Top categories in the window: (.+)\.$/);if(m)return`该窗口内高频分类：${m[1]}。`;m=text.match(/^Commercial\/partnership signal count: (\d+); product\/technical feedback signal count: (\d+)\.$/);if(m)return '商业/合作信号 '+m[1]+' 个；产品/技术反馈信号 '+m[2]+' 个。';m=text.match(/^There are (\d+) business, purchase, partnership, investment, or enterprise-style conversations/);if(m)return '发现 '+m[1]+' 个商业、采购、合作、投资或企业意向会话，应先作为 pipeline 或生态机会跟进，避免线索变冷。';m=text.match(/^Account issues plus waiting states create (\d+) visible blockers/);if(m)return '账号问题和等待状态形成 '+m[1]+' 个可见阻塞，这是当前最明确的用户体验问题，因为用户无法在没有人工或补充信息的情况下继续推进。';m=text.match(/^There are (\d+) technical, enterprise-readiness, or billing-plan signals/);if(m)return '发现 '+m[1]+' 个技术、企业级能力或账单套餐信号，可转为文档、定价文案和 roadmap 证据。';m=text.match(/^There are (\d+) data or automation quality signals/);if(m)return '发现 '+m[1]+' 个数据或自动化质量信号，先清理 failed_needs_review，再排查 sender_email 缺失。';return text;}function priorityText(p){if(p==='high')return t('priorityHigh');if(p==='medium')return t('priorityMedium');return t('priorityLow');}
function applyStaticText(){document.documentElement.lang=state.lang==='zh'?'zh':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});document.querySelectorAll('[data-i18n-option]').forEach(el=>{el.textContent=t(el.dataset.i18nOption);});$('refresh').textContent=t('refresh');$('lang-toggle').textContent=t('switchLang');$('apply-filters').textContent=t('apply');$('search-filter').placeholder=t('search');const cs=$('category-filter');if(cs.options.length)cs.options[0].textContent=t('allCategories');}
function badgeClass(step){if(step==='failed_needs_review')return'bad';if(step==='manual_review'||step?.startsWith('awaiting'))return'warn';if(step==='draft_created')return'info';if(step==='closed_spam'||step==='done')return'ok';if(step==='forwarded_keep_open'||step==='moved_inbox'||step==='ticket_created')return'purple';return'';}function actionBadge(status){return status==='failed'?'bad':'ok';}async function fetchJson(url){const response=await fetch(url);if(!response.ok)throw new Error(`${response.status} ${url}`);return response.json();}
async function load(){applyStaticText();$('generated').textContent=t('loading');const status=$('status-filter')?.value||'all';const category=$('category-filter')?.value||'';const q=encodeURIComponent($('search-filter')?.value||'');const[summary,report,conversations,actions,sybil]=await Promise.all([fetchJson('/ops/api/summary'),fetchJson(`/ops/api/report?period=${state.period}`),fetchJson(`/ops/api/conversations?status=${encodeURIComponent(status)}&category=${encodeURIComponent(category)}&q=${q}`),fetchJson('/ops/api/actions'),fetchJson('/ops/api/sybil')]);state.summary=summary;state.report=report;state.conversations=conversations.items||[];state.actions=actions.items||[];state.sybil=sybil.items||[];render();}
function render(){applyStaticText();renderChrome();renderMetrics();renderOperationalFocus();renderCategoryFilter();renderReport();renderConversations();renderActions();renderSybil();}
function missingValue(){return state.lang==='zh'?'历史未采集':'Not captured historically';}
function renderPageTitle(){const titles=state.lang==='zh'?{overview:'运营概览',conversations:'会话处理',reports:'运营报告',actions:'动作日志',sybil:'教育版账号异常队列'}:{overview:'Operations overview',conversations:'Conversations',reports:'Operations report',actions:'Action log',sybil:'Education account exceptions'};$('page-title').textContent=titles[state.view]||titles.overview;}

['近 30 天发件人 + 摘要',data.recent_30d_coverage_rate||0,`${data.recent_30d_complete||0}/${data.recent_30d_rows||0}`],

]:[

];$('data-health').innerHTML=coverageItems.map(([label,value,note])=>`<div class="coverage-block"><div class="coverage-top"><span>${esc(label)}</span><strong>${pct(value)}</strong></div><div class="coverage-track"><div class="coverage-fill" style="width:${Math.max(0,Math.min(100,Number(value||0)))}%"></div></div><div class="health-note">${esc(note)}</div></div>`).join('');$('data-note').textContent=zh?'历史资料每 15 分钟自动补全 20 条；不会覆盖已有值，也不会计入新工作量。':'Historical metadata backfills 20 rows every 15 minutes without overwriting values or inflating workload.';}

['Direct adoption',pct(m.draft_direct_adoption_rate),'sent drafts'],
['Needs action',m.current_attention||0,`${m.current_failed||0} failed`]
];$('report-cards').innerHTML=cards.map(([label,value,note])=>`<div class="report-card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="note">${esc(note)}</div></div>`).join('');$('report-note').textContent=trText(r.source_note||'');renderAnalysis(r.analysis||{});renderConversationTable('report-attention-table',(r.attention_items||[]).slice(0,12));}
function renderAnalysis(analysis){const summaries=(analysis.executive_summary||[]).slice(0,3);$('analysis-summary').innerHTML=summaries.length?summaries.map(item=>`<li>${esc(trText(item))}</li>`).join(''):`<li>${t('noAnalysis')}</li>`;renderDecisionPoints((analysis.decision_points||[]).slice(0,3));const actions=(analysis.recommended_actions||[]).slice(0,5);$('recommended-actions').innerHTML=actions.length?actions.map(item=>`<li>${esc(trText(item))}</li>`).join(''):`<li>${t('noRecommended')}</li>`;}
function renderDecisionPoints(items){$('decision-points').innerHTML=items.map(item=>{const examples=item.examples||[];const links=examples.length?`<div class="examples">${examples.map(ex=>`<a href="${esc(ex.front_url)}" target="_blank" rel="noreferrer">${esc(ex.conversation_id)}</a>`).join('')}</div>`:'';return`<div class="decision-row"><div class="decision-top"><div class="decision-title">${esc(trText(item.title))}</div><span class="badge ${item.priority==='high'?'bad':item.priority==='medium'?'warn':'info'}">${esc(priorityText(item.priority))}</span></div><div class="decision-detail">${esc(trText(item.detail))}</div>${links}</div>`;}).join('');}
function renderConversationTable(id,items){if(!items.length){$(id).innerHTML=`<tbody><tr><td><div class="empty">${t('noConversations')}</div></td></tr></tbody>`;return;}$(id).innerHTML=`<thead><tr><th>${t('conversation')}</th><th>${t('sender')}</th><th>${t('category')}</th><th>${t('step')}</th><th>${t('summary')}</th><th>${t('updatedCol')}</th></tr></thead><tbody>${items.map(item=>`<tr><td><a class="id-link" href="${esc(item.front_url)}" target="_blank" rel="noreferrer">${esc(item.conversation_id)}</a></td><td>${item.sender_email?esc(item.sender_email):`<span class="missing">${esc(missingValue())}</span>`}</td><td>${esc(item.category)}</td><td><span class="badge ${badgeClass(item.step)}">${esc(item.step)}</span></td><td class="clip" title="${esc(item.summary)}">${item.summary?esc(item.summary):`<span class="missing">${esc(missingValue())}</span>`}</td><td class="muted">${esc(fmtDate(item.updated_at))}</td></tr>`).join('')}</tbody>`;}function renderActionTable(id,items){if(!items.length){$(id).innerHTML=`<tbody><tr><td><div class="empty">${t('noActions')}</div></td></tr></tbody>`;return;}$(id).innerHTML=`<thead><tr><th>${t('action')}</th><th>${t('status')}</th><th>${t('conversation')}</th><th>${t('result')}</th><th>${t('created')}</th></tr></thead><tbody>${items.map(item=>`<tr><td>${esc(item.action_type)}</td><td><span class="badge ${actionBadge(item.status)}">${esc(item.status)}</span></td><td><a class="id-link" href="${esc(item.front_url)}" target="_blank" rel="noreferrer">${esc(item.conversation_id)}</a></td><td class="clip" title="${esc(item.result)}">${esc(item.result||'-')}</td><td class="muted">${esc(fmtDate(item.created_at))}</td></tr>`).join('')}</tbody>`;}function renderSybilTable(id,items){if(!items.length){$(id).innerHTML=`<tbody><tr><td><div class="empty">${t('noNotifications')}</div></td></tr></tbody>`;return;}$(id).innerHTML=`<thead><tr><th>${t('status')}</th><th>${t('type')}</th><th>${t('conversation')}</th><th>${t('message')}</th><th>${t('queued')}</th><th>${t('sent')}</th><th>${t('actionCol')}</th></tr></thead><tbody>${items.map(item=>`<tr><td><span class="badge ${item.status==='sent'?'ok':item.status==='dismissed'?'':item.error?'bad':'warn'}">${esc(item.status)}</span></td><td>${esc(item.handoff_type||'-')}</td><td><a class="id-link" href="${esc(item.front_url)}" target="_blank" rel="noreferrer">${esc(item.conversation_id)}</a></td><td class="clip" title="${esc(item.message)}">${esc(item.message||item.error||'-')}</td><td class="muted">${esc(fmtDate(item.created_at))}</td><td class="muted">${esc(fmtDate(item.sent_at))}</td><td>${item.status==='pending'?`<button type="button" class="button compact danger" data-sybil-dismiss="${esc(item.id)}" data-conversation-id="${esc(item.conversation_id)}">${t('remove')}</button>`:''}</td></tr>`).join('')}</tbody>`;$(id).querySelectorAll('[data-sybil-dismiss]').forEach(button=>button.addEventListener('click',()=>dismissSybil(button.dataset.sybilDismiss,button.dataset.conversationId).catch(showError)));}function renderConversations(){$('conv-count').textContent=`${state.conversations.length} ${t('rowsFiltered')}`;renderConversationTable('conversation-table',state.conversations);}function renderActions(){$('action-count').textContent=`${state.actions.length} ${t('rowsActions')}`;renderActionTable('actions-table',state.actions);}function renderSybil(){$('sybil-count').textContent=`${state.sybil.length} ${t('rowsSybil')}`;renderSybilTable('sybil-table',state.sybil);}function setView(view){state.view=view;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===`view-${view}`));document.querySelectorAll('.nav button').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===view));renderPageTitle();}
async function dismissSybil(id,conversationId){if(!window.confirm(`${t('removeConfirm')} ${conversationId}`))return;if(!opsWriteSecret)opsWriteSecret=window.prompt(t('writePassword'))||'';if(!opsWriteSecret)return;const response=await fetch(`/ops/api/sybil/${encodeURIComponent(id)}`,{method:'DELETE',headers:{'X-Ops-Write-Secret':opsWriteSecret}});if(response.status===403)opsWriteSecret='';if(!response.ok){let detail=t('dismissFailed');try{const body=await response.json();detail=body.detail||detail;}catch(_error){}throw new Error(detail);}await load();}
document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.view)));document.querySelectorAll('[data-open-view]').forEach(btn=>btn.addEventListener('click',()=>{const status=btn.dataset.status;if(status)$('status-filter').value=status;setView(btn.dataset.openView);load().catch(showError);}));document.querySelectorAll('[data-period]').forEach(btn=>btn.addEventListener('click',()=>{state.period=btn.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x.dataset.period===state.period));load().catch(showError);}));$('refresh').addEventListener('click',()=>load().catch(showError));$('apply-filters').addEventListener('click',()=>load().catch(showError));$('search-filter').addEventListener('keydown',event=>{if(event.key==='Enter')load().catch(showError);});$('lang-toggle').addEventListener('click',()=>{state.lang=state.lang==='zh'?'en':'zh';localStorage.setItem('ops_lang',state.lang);render();});function showError(error){$('generated').textContent=error.message;console.error(error);}applyStaticText();load().catch(showError);
</script>
