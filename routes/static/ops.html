const TEXT_ZH=new Map([['Follow the commercial leads first','优先跟进商业线索'],['Reduce access and waiting friction','降低账号和等待摩擦'],['Turn repeated questions into product or docs work','把重复问题转成产品/文档动作'],['Clean up automation quality signals','清理自动化质量问题'],['Metrics come from local SQLite tables: conversation_states, conversation_actions, webhook_events, and sybil_notifications. They reflect conversations tracked by Front-Agent, not every message that may exist in Front.','指标来自本地 SQLite 表：conversation_states、conversation_actions、webhook_events 和 sybil_notifications。它们反映的是 Front-Agent 已跟踪的会话，不等于 Front 里所有消息。'],['Revenue and partnership demand','收入和合作需求'],['Business, purchase, partnership, and investment conversations indicate active commercial intent. Review these as sales or ecosystem leads, not just support workload.','Business、purchase、partnership、investment 类会话代表明确商业意图，应作为销售或生态线索跟进，而不只是客服负载。'],['Education adoption signal','教育场景采用信号'],['Education plan requests show student and institution adoption. This can inform campus growth, eligibility rules, and education onboarding content.','教育版请求反映学生和学校侧采用情况，可用于校园增长、资格规则和教育版 onboarding 内容优化。'],['Product and enterprise-readiness feedback','产品和企业级能力反馈'],['Technical, roadmap, security, and data export questions are direct product feedback. They often reveal missing docs, enterprise trust requirements, or features users expect.','technical、roadmap、security、data_export 问题是直接产品反馈，常暴露缺失文档、企业信任要求或用户期待的能力。'],['Account access friction','账号访问摩擦'],['Account, login, verification, email-change, and deletion requests are user-experience friction. They should be separated from generic support because they block product access.','账号、登录、验证、邮箱变更和删除账号请求是用户体验摩擦，应单独看待，因为它们会阻断用户进入产品。'],['Billing and plan confusion','账单和套餐理解成本'],['Billing conversations usually point to plan, invoice, downgrade, or refund confusion. These are sensitive moments that can affect retention.','账单会话通常指向套餐、发票、降级或退款困惑，这些是影响留存的敏感节点。'],['Users are stuck waiting for next information or review','用户卡在等待信息或审核'],['Awaiting states mean the support flow depends on missing user data or manual review. Long-lived awaiting states are a user-experience drag and can make automation look unresponsive.','awaiting 状态说明流程依赖用户补充信息或人工审核。长期 awaiting 会拖累体验，也会让自动化显得无响应。'],['Sender email missing in tracked state','已跟踪状态缺少 sender_email'],['Missing sender_email reduces history quality and can weaken draft recipient safety. This is a data-quality issue in the ingestion/state path, not a customer demand signal.','缺少 sender_email 会降低用户历史质量，也会削弱草稿收件人安全性。这是接入/状态写入的数据质量问题，不是客户需求信号。'],['Failed conversations need manual repair','失败会话需要人工修复'],['failed_needs_review means the handler or skill flow did not complete safely. These should be reviewed before judging automation quality from aggregate numbers.','failed_needs_review 表示 handler 或 skill flow 没有安全完成。评估自动化质量前，应先处理这些失败项。'],['Sybil handoffs pending','Sybil handoff 待发送'],['Pending Sybil notifications mean education handoffs are queued but not yet sent or cleared. This is expected before digest time, but should not accumulate.','pending Sybil 通知表示教育版 handoff 已排队但尚未发送或清理。digest 时间前这是正常的，但不应长期堆积。'],['Create a weekly lead review for business, purchase, partnership, and investment categories with Front links and owner assignment.','建立每周线索 review：覆盖 business、purchase、partnership、investment 分类，带 Front 链接和负责人。'],['Track education requests by school/domain and convert repeated schools into onboarding or campus ambassador opportunities.','按学校/domain 跟踪教育版请求，把重复出现的学校转为 onboarding 或校园推广机会。'],['Review technical and roadmap questions weekly with product/docs owners and convert repeated asks into docs or roadmap evidence.','每周和产品/文档负责人 review technical 与 roadmap 问题，把重复问题转成文档或 roadmap 证据。'],['Break down account issues by subtype and fix the top blocker first, especially verification-code and identity-verification flows.','按 subtype 拆解账号问题，优先修复最大阻塞，尤其是验证码和身份验证流程。'],['Turn repeated billing and downgrade cases into clearer in-product copy and billing help-center entries.','把重复账单/降级案例转成更清晰的产品内文案和账单帮助文档。'],['Add a stale-awaiting review habit and improve prompts that ask users for missing information.','建立 stale awaiting review 习惯，并优化向用户索取缺失信息的提示。'],['Audit why sender_email is blank for recent conversations and preserve it whenever Front provides the original sender.','排查近期会话 sender_email 为空的原因，并在 Front 提供原始发件人时稳定保存。'],['Clear failed_needs_review daily and capture root cause as either routing bug, skill gap, or external API failure.','每天清理 failed_needs_review，并记录根因：路由 bug、skill 缺口或外部 API 失败。']]);
function t(key){return I18N[state.lang][key]||I18N.en[key]||key;}function trText(text){if(state.lang==='en')return text||'';return TEXT_ZH.get(text)||translateDynamic(text||'');}function translateDynamic(text){let m=text.match(/^(\d+) tracked conversations changed in this window; (\d+) currently need attention\.$/);if(m)return`该窗口内 ${m[1]} 个已跟踪会话发生变化；当前 ${m[2]} 个需要处理。`;m=text.match(/^Top categories in the window: (.+)\.$/);if(m)return`该窗口内高频分类：${m[1]}。`;m=text.match(/^Commercial\/partnership signal count: (\d+); product\/technical feedback signal count: (\d+)\.$/);if(m)return '商业/合作信号 '+m[1]+' 个；产品/技术反馈信号 '+m[2]+' 个。';m=text.match(/^There are (\d+) business, purchase, partnership, investment, or enterprise-style conversations/);if(m)return '发现 '+m[1]+' 个商业、采购、合作、投资或企业意向会话，应先作为 pipeline 或生态机会跟进，避免线索变冷。';m=text.match(/^Account issues plus waiting states create (\d+) visible blockers/);if(m)return '账号问题和等待状态形成 '+m[1]+' 个可见阻塞，这是当前最明确的用户体验问题，因为用户无法在没有人工或补充信息的情况下继续推进。';m=text.match(/^There are (\d+) technical, enterprise-readiness, or billing-plan signals/);if(m)return '发现 '+m[1]+' 个技术、企业级能力或账单套餐信号，可转为文档、定价文案和 roadmap 证据。';m=text.match(/^There are (\d+) data or automation quality signals/);if(m)return '发现 '+m[1]+' 个数据或自动化质量信号，先清理 failed_needs_review，再排查 sender_email 缺失。';return text;}function priorityText(p){if(p==='high')return t('priorityHigh');if(p==='medium')return t('priorityMedium');return t('priorityLow');}
function applyStaticText(){document.documentElement.lang=state.lang==='zh'?'zh':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});document.querySelectorAll('[data-i18n-option]').forEach(el=>{el.textContent=t(el.dataset.i18nOption);});$('refresh').textContent=t('refresh');$('lang-toggle').textContent=t('switchLang');$('apply-filters').textContent=t('apply');$('search-filter').placeholder=t('search');const cs=$('category-filter');if(cs.options.length)cs.options[0].textContent=t('allCategories');}
function badgeClass(step){if(step==='failed_needs_review')return'bad';if(step==='manual_review'||step?.startsWith('awaiting'))return'warn';if(step==='draft_created')return'info';if(step==='closed_spam'||step==='done')return'ok';if(step==='forwarded_keep_open'||step==='moved_inbox'||step==='ticket_created')return'purple';return'';}function actionBadge(status){return status==='failed'?'bad':'ok';}async function fetchJson(url){const response=await fetch(url);if(!response.ok)throw new Error(`${response.status} ${url}`);return response.json();}
async function load(){applyStaticText();$('generated').textContent=t('loading');const status=$('status-filter')?.value||'all';const category=$('category-filter')?.value||'';const q=encodeURIComponent($('search-filter')?.value||'');const[summary,report,conversations,actions,sybil]=await Promise.all([fetchJson('/ops/api/summary'),fetchJson(`/ops/api/report?period=${state.period}`),fetchJson(`/ops/api/conversations?status=${encodeURIComponent(status)}&category=${encodeURIComponent(category)}&q=${q}`),fetchJson('/ops/api/actions'),fetchJson('/ops/api/sybil')]);state.summary=summary;state.report=report;state.conversations=conversations.items||[];state.actions=actions.items||[];state.sybil=sybil.items||[];render();}
function render(){applyStaticText();renderChrome();renderMetrics();renderFocusPanels();renderCategoryFilter();renderAttention();renderRecentActions();renderBars('category-bars',state.summary.by_category||{});renderBars('step-bars',state.summary.by_step||{});renderSybilSummary();renderReport();renderConversations();renderActions();renderSybil();}function renderChrome(){$('generated').textContent=`${t('updated')} ${fmtDate(state.summary.generated_at)}`;$('service-status').textContent=state.summary.service?.status==='ok'?t('serviceOk'):t('serviceIssue');$('scheduler-status').textContent=state.summary.service?.scheduler_running?t('schedulerRunning'):t('schedulerDisabled');}
function renderMetrics(){const m=state.summary.metrics||{};const da=state.summary.draft_adoption_7d||{};const items=[[t('needsAttention'),m.attention_count||0,`${m.failed_count||0} ${t('failed').toLowerCase()}, ${m.stale_waiting_count||0} stale waiting`],[state.lang==='zh'?'7d 草稿原样采用率':'7d direct draft adoption',pct(da.direct_adoption_rate),`${da.exact_adopted||0}/${da.eligible_drafts||0} ${state.lang==='zh'?'可判定草稿':'eligible drafts'}`],[state.lang==='zh'?'24h Webhook':'24h webhooks',m.webhooks_24h||0,state.lang==='zh'?'Front-Agent 接收的事件':'events accepted by Front-Agent'],[state.lang==='zh'?'24h 状态更新':'24h updated states',m.conversations_24h||0,state.lang==='zh'?'conversation_states 更新数':'conversation_states updated'],[state.lang==='zh'?'已跟踪总量':'Tracked total',m.total_conversations||0,state.lang==='zh'?'conversation_states 全部行数':'all rows in conversation_states']];$('metrics').innerHTML=items.map(([label,value,note])=>`<div class="metric"><div class="metric-label">${esc(label)}</div><div><div class="metric-value">${esc(value)}</div><div class="metric-note">${esc(note)}</div></div></div>`).join('');$('data-note').innerHTML=`<strong>${t('dataSource')}</strong>${t('dataNote')}`;}
function renderFocusPanels(){const ops=state.summary.opportunity_items||[];$("opportunity-list").innerHTML=ops.length?ops.map(item=>`<div class="item-row"><div class="item-main"><div class="item-title"><a class="id-link" href="${esc(item.front_url)}" target="_blank" rel="noreferrer">${esc(item.conversation_id)}</a> · ${esc(item.category)}</div><div class="item-sub">${esc(item.sender_email||item.summary||"-")}</div></div><span class="badge ${badgeClass(item.step)}">${esc(item.step)}</span></div>`).join(""):`<div class="empty">${t("noOpportunities")}</div>`;const friction={};(state.summary.top_user_frictions||[]).forEach(item=>{friction[`${item.category}:${item.sub_type}`]=item.count;});renderBars("friction-bars",friction);}function renderCategoryFilter(){const select=$('category-filter');const current=select.value;const categories=Object.keys(state.summary.by_category||{}).sort();select.innerHTML=`<option value="">${t('allCategories')}</option>`+categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');select.value=categories.includes(current)?current:'';}function renderAttention(){const items=state.report?.attention_items||[];$('attention-sub').textContent=state.lang==='zh'?`${state.summary.metrics.attention_count||0} 个当前关注项`:`${state.summary.metrics.attention_count||0} current items from tracked state`;renderConversationTable('attention-table',items.slice(0,8));}function renderRecentActions(){renderActionTable('recent-actions-table',state.summary.recent_actions||[]);}function renderBars(id,data){const entries=Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,10);const max=Math.max(...entries.map(([,v])=>v),1);$(id).innerHTML=entries.length?entries.map(([label,count])=>`<div class="bar-row"><div class="bar-label" title="${esc(label)}">${esc(label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,Math.round(count/max*100))}%"></div></div><div class="bar-count">${esc(count)}</div></div>`).join(''):`<div class="empty">${t('noData')}</div>`;}function renderSybilSummary(){const data=state.summary.sybil_by_status||{};const total=Object.values(data).reduce((a,b)=>a+b,0);$('sybil-sub').textContent=`${total} ${t('notifications')}`;renderBars('sybil-summary',data);}
function renderReport(){const r=state.report||{};const m=r.metrics||{};$('report-window').textContent=`${r.period==='monthly'?t('last30'):r.period==='weekly'?t('last7'):t('last24')} - ${fmtDate(r.window_start)} ${t('to')} ${fmtDate(r.window_end)}`;$('report-note').innerHTML=`<strong>${t('sourceNote')}</strong>${esc(trText(r.source_note||''))}`;const cards=[[state.lang==='zh'?'更新会话':'Updated conversations',m.updated_conversations||0,`${m.new_state_rows||0} ${state.lang==='zh'?'个新增跟踪行':'new tracked rows'}`],[state.lang==='zh'?'Webhook 处理数':'Webhooks processed',m.webhooks_processed||0,state.lang==='zh'?'窗口内接收事件':'accepted events in window'],[state.lang==='zh'?'动作日志':'Actions logged',m.actions_logged||0,state.lang==='zh'?'去重后的工具副作用':'deduped tool side effects'],[state.lang==='zh'?'处理信号':'Handled signals',m.handled_signal||0,`${m.drafts||0} drafts, ${m.handoffs||0} handoffs, ${m.tickets||0} tickets`],[state.lang==='zh'?'草稿原样采用率':'Direct draft adoption',pct(m.draft_direct_adoption_rate),state.lang==='zh'?'发送内容与 AI 草稿完全一致':'sent body exactly matched draft'],[state.lang==='zh'?'草稿回复采用率':'Draft sent/replied rate',pct(m.draft_sent_or_replied_rate),state.lang==='zh'?'原样采用 + 修改后发送':'exact + modified/manual sent'],[state.lang==='zh'?'关闭垃圾邮件':'Closed spam',m.closed_spam||0,state.lang==='zh'?'确定性 spam 路由':'deterministic spam route'],[state.lang==='zh'?'当前关注项':'Current attention',m.current_attention||0,`${pct(m.attention_rate)} ${state.lang==='zh'?'占已跟踪总量':'of tracked total'}`],[state.lang==='zh'?'当前失败':'Current failed',m.current_failed||0,`${pct(m.failure_rate_period)} ${state.lang==='zh'?'窗口内失败率':'failure rate in window'}`],[state.lang==='zh'?'Sybil 队列':'Sybil queue',m.pending_sybil||0,`${m.sent_sybil||0} ${state.lang==='zh'?'窗口内已发送':'sent in window'}`],[state.lang==='zh'?'已跟踪总量':'Tracked total',m.tracked_total||0,state.lang==='zh'?'conversation_states 全量':'conversation_states all time']];$('report-cards').innerHTML=cards.map(([label,value,note])=>`<div class="report-card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="note">${esc(note)}</div></div>`).join('');renderAnalysis(r.analysis||{});renderBars('report-category-bars',r.by_category||{});renderBars('report-step-bars',r.by_step||{});renderConversationTable('report-attention-table',r.attention_items||[]);}
function renderAnalysis(analysis){const summaries=analysis.executive_summary||[];$('analysis-summary').innerHTML=summaries.length?summaries.map(item=>`<li>${esc(trText(item))}</li>`).join(''):`<li>${t('noAnalysis')}</li>`;renderDecisionPoints(analysis.decision_points||[]);renderInsightColumn('opportunity-insights',analysis.opportunities||[]);renderInsightColumn('experience-insights',analysis.experience_signals||[]);renderInsightColumn('risk-insights',analysis.operational_risks||[]);const actions=analysis.recommended_actions||[];$('recommended-actions').innerHTML=actions.length?actions.map(item=>`<li>${esc(trText(item))}</li>`).join(''):`<li>${t('noRecommended')}</li>`;}function renderDecisionPoints(items){const target=document.getElementById('decision-points');target.innerHTML=items.length?items.map(item=>{const cls=item.priority==='high'?'bad':item.priority==='medium'?'warn':'info';const examples=item.examples||[];const links=examples.length?'<div class="examples">'+examples.map(ex=>'<a href="'+esc(ex.front_url)+'" target="_blank" rel="noreferrer">'+esc(ex.conversation_id)+' · '+esc(ex.category)+' · '+esc(ex.step)+'</a>').join('')+'</div>':'';return '<div class="decision-card"><div class="insight-top"><div class="insight-title">'+esc(trText(item.title))+'</div><span class="badge '+cls+'">'+esc(priorityText(item.priority))+'</span></div><div class="insight-detail">'+esc(trText(item.detail))+'</div>'+links+'</div>';}).join(''):'';}function renderInsightColumn(id,items){$(id).innerHTML=items.length?items.map(item=>{const examples=item.examples||[];const links=examples.length?`<div class="examples">${examples.map(ex=>`<a href="${esc(ex.front_url)}" target="_blank" rel="noreferrer">${esc(ex.conversation_id)} · ${esc(ex.category)} · ${esc(ex.step)}</a>`).join('')}</div>`:'';return`<div class="insight-card"><div class="insight-top"><div class="insight-title">${esc(trText(item.title))}</div><span class="badge ${item.priority==='high'?'bad':item.priority==='medium'?'warn':'info'}">${esc(priorityText(item.priority))}</span></div><div class="insight-detail">${esc(trText(item.detail))}</div><div class="insight-evidence">${t('evidence')}: ${esc(item.evidence_count||0)} ${t('trackedRows')}</div>${links}</div>`;}).join(''):`<div class="empty">${t('noSignal')}</div>`;}
function renderConversationTable(id,items){if(!items.length){$(id).innerHTML=`<tbody><tr><td><div class="empty">${t('noConversations')}</div></td></tr></tbody>`;return;}$(id).innerHTML=`<thead><tr><th>${t('conversation')}</th><th>${t('sender')}</th><th>${t('category')}</th><th>${t('step')}</th><th>${t('summary')}</th><th>${t('updatedCol')}</th></tr></thead><tbody>${items.map(item=>`<tr><td><a class="id-link" href="${esc(item.front_url)}" target="_blank" rel="noreferrer">${esc(item.conversation_id)}</a></td><td>${esc(item.sender_email||'-')}</td><td>${esc(item.category)}</td><td><span class="badge ${badgeClass(item.step)}">${esc(item.step)}</span></td><td class="clip" title="${esc(item.summary)}">${esc(item.summary||'-')}</td><td class="muted">${esc(fmtDate(item.updated_at))}</td></tr>`).join('')}</tbody>`;}function renderActionTable(id,items){if(!items.length){$(id).innerHTML=`<tbody><tr><td><div class="empty">${t('noActions')}</div></td></tr></tbody>`;return;}$(id).innerHTML=`<thead><tr><th>${t('action')}</th><th>${t('status')}</th><th>${t('conversation')}</th><th>${t('result')}</th><th>${t('created')}</th></tr></thead><tbody>${items.map(item=>`<tr><td>${esc(item.action_type)}</td><td><span class="badge ${actionBadge(item.status)}">${esc(item.status)}</span></td><td><a class="id-link" href="${esc(item.front_url)}" target="_blank" rel="noreferrer">${esc(item.conversation_id)}</a></td><td class="clip" title="${esc(item.result)}">${esc(item.result||'-')}</td><td class="muted">${esc(fmtDate(item.created_at))}</td></tr>`).join('')}</tbody>`;}function renderSybilTable(id,items){if(!items.length){$(id).innerHTML=`<tbody><tr><td><div class="empty">${t('noNotifications')}</div></td></tr></tbody>`;return;}$(id).innerHTML=`<thead><tr><th>${t('status')}</th><th>${t('type')}</th><th>${t('conversation')}</th><th>${t('message')}</th><th>${t('queued')}</th><th>${t('sent')}</th><th>${t('actionCol')}</th></tr></thead><tbody>${items.map(item=>`<tr><td><span class="badge ${item.status==='sent'?'ok':item.status==='dismissed'?'':item.error?'bad':'warn'}">${esc(item.status)}</span></td><td>${esc(item.handoff_type||'-')}</td><td><a class="id-link" href="${esc(item.front_url)}" target="_blank" rel="noreferrer">${esc(item.conversation_id)}</a></td><td class="clip" title="${esc(item.message)}">${esc(item.message||item.error||'-')}</td><td class="muted">${esc(fmtDate(item.created_at))}</td><td class="muted">${esc(fmtDate(item.sent_at))}</td><td>${item.status==='pending'?`<button type="button" class="button compact danger" data-sybil-dismiss="${esc(item.id)}" data-conversation-id="${esc(item.conversation_id)}">${t('remove')}</button>`:''}</td></tr>`).join('')}</tbody>`;$(id).querySelectorAll('[data-sybil-dismiss]').forEach(button=>button.addEventListener('click',()=>dismissSybil(button.dataset.sybilDismiss,button.dataset.conversationId).catch(showError)));}function renderConversations(){$('conv-count').textContent=`${state.conversations.length} ${t('rowsFiltered')}`;renderConversationTable('conversation-table',state.conversations);}function renderActions(){$('action-count').textContent=`${state.actions.length} ${t('rowsActions')}`;renderActionTable('actions-table',state.actions);}function renderSybil(){$('sybil-count').textContent=`${state.sybil.length} ${t('rowsSybil')}`;renderSybilTable('sybil-table',state.sybil);}function setView(view){state.view=view;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id===`view-${view}`));document.querySelectorAll('.nav button').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===view));}
async function dismissSybil(id,conversationId){if(!window.confirm(`${t('removeConfirm')} ${conversationId}`))return;if(!opsWriteSecret)opsWriteSecret=window.prompt(t('writePassword'))||'';if(!opsWriteSecret)return;const response=await fetch(`/ops/api/sybil/${encodeURIComponent(id)}`,{method:'DELETE',headers:{'X-Ops-Write-Secret':opsWriteSecret}});if(response.status===403)opsWriteSecret='';if(!response.ok){let detail=t('dismissFailed');try{const body=await response.json();detail=body.detail||detail;}catch(_error){}throw new Error(detail);}await load();}
document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>setView(btn.dataset.view)));document.querySelectorAll('[data-open-view]').forEach(btn=>btn.addEventListener('click',()=>{const status=btn.dataset.status;if(status)$('status-filter').value=status;setView(btn.dataset.openView);load().catch(showError);}));document.querySelectorAll('[data-period]').forEach(btn=>btn.addEventListener('click',()=>{state.period=btn.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x.dataset.period===state.period));load().catch(showError);}));$('refresh').addEventListener('click',()=>load().catch(showError));$('apply-filters').addEventListener('click',()=>load().catch(showError));$('search-filter').addEventListener('keydown',event=>{if(event.key==='Enter')load().catch(showError);});$('lang-toggle').addEventListener('click',()=>{state.lang=state.lang==='zh'?'en':'zh';localStorage.setItem('ops_lang',state.lang);render();});function showError(error){$('generated').textContent=error.message;console.error(error);}applyStaticText();load().catch(showError);
</script>
</body>
