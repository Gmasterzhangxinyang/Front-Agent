<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评价 AI 回复</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
  .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h1 { margin-top: 0; color: #333; }
  .meta { color: #666; font-size: 14px; margin-bottom: 24px; }
  .meta span { background: #e8f4fd; padding: 2px 8px; border-radius: 4px; font-family: monospace; }
  label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; }
  textarea, input[type="text"] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  textarea { resize: vertical; }
  .score-group { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; }
  .score-btn { width: 48px; height: 40px; border: 1px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .score-btn:hover { background: #f0f0f0; }
  .score-btn.selected { background: #3b82f6; color: white; border-color: #3b82f6; }
  .submit-btn { background: #3b82f6; color: white; border: none; padding: 12px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; }
  .submit-btn:hover { background: #2563eb; }
  .success { background: #dcfce7; color: #166534; padding: 16px; border-radius: 8px; margin-top: 16px; }
  .error { background: #fee2e2; color: #991b1b; padding: 16px; border-radius: 8px; margin-top: 16px; }
  .disclaimer { background: #fef9c3; color: #854d0e; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>评价 AI 回复</h1>
  <div class="meta">
    Conversation ID：<span id="conv_id">加载中...</span><br>
    Skill 分类：<span id="category">-</span>
  </div>

  <div class="disclaimer">评分标准：0-3 = 回答有误或不全，4-6 = 基本正确但可改进，7-10 = 满足要求</div>

  <label>评分（0-10）</label>
  <div class="score-group" id="score_group">
    <button class="score-btn" data-score="0">0</button>
    <button class="score-btn" data-score="1">1</button>
    <button class="score-btn" data-score="2">2</button>
    <button class="score-btn" data-score="3">3</button>
    <button class="score-btn" data-score="4">4</button>
    <button class="score-btn" data-score="5">5</button>
    <button class="score-btn" data-score="6">6</button>
    <button class="score-btn" data-score="7">7</button>
    <button class="score-btn" data-score="8">8</button>
    <button class="score-btn" data-score="9">9</button>
    <button class="score-btn" data-score="10">10</button>
  </div>
  <input type="hidden" id="score" value="5">

  <label>正确回复（选填）</label>
  <textarea id="correct_reply" rows="4" placeholder="如果 AI 回复不对，这里写正确的回复..."></textarea>

  <label>修改建议（选填）</label>
  <textarea id="suggestion" rows="4" placeholder="对 skill 内容或流程的修改建议..."></textarea>

  <button class="submit-btn" id="submit_btn">提交评价</button>
  <div id="result"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const convId = params.get('conv') || '';
const category = params.get('category') || '';

document.getElementById('conv_id').textContent = convId;
document.getElementById('category').textContent = category;

let selectedScore = 5;
document.querySelectorAll('.score-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedScore = parseInt(btn.dataset.score);
    document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('score').value = selectedScore;
  });
});
document.querySelector('.score-btn[data-score="5"]').classList.add('selected');

document.getElementById('submit_btn').addEventListener('click', async () => {
  const btn = document.getElementById('submit_btn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const resp = await fetch('/feedback/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversation_id: convId,
        category: category,
        score: selectedScore,
        correct_reply: document.getElementById('correct_reply').value,
        suggestion: document.getElementById('suggestion').value,
      })
    });
    const data = await resp.json();
    if (data.status === 'ok') {
      document.getElementById('result').innerHTML = '<div class="success">评价已提交！</div>';
      document.getElementById('submit_btn').style.display = 'none';
    } else {
      document.getElementById('result').innerHTML = '<div class="error">提交失败：' + (data.message || '未知错误') + '</div>';
      btn.disabled = false;
      btn.textContent = '提交评价';
    }
  } catch(e) {
    document.getElementById('result').innerHTML = '<div class="error">无法连接后端服务</div>';
    btn.disabled = false;
    btn.textContent = '提交评价';
  }
});
</script>
</body>
</html>
