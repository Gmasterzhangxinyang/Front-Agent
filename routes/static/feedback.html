<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评价 AI 回复</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 48px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 32px 64px rgba(0,0,0,0.3);
  }
  .header {
    margin-bottom: 40px;
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .title-icon {
    width: 48px;
    height: 48px;
    background: #000;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    color: #000;
    letter-spacing: -0.5px;
  }
  .meta {
    display: flex;
    gap: 12px;
    margin-top: 12px;
  }
  .meta-tag {
    background: #f5f5f5;
    color: #666;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    font-family: 'SF Mono', monospace;
  }
  .divider {
    height: 1px;
    background: #e5e5e5;
    margin: 32px 0;
  }
  .field-label {
    font-size: 15px;
    font-weight: 600;
    color: #000;
    margin-bottom: 16px;
    letter-spacing: -0.2px;
  }
  .score-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .score-btn {
    flex: 1;
    min-width: 44px;
    height: 48px;
    border: 2px solid #e5e5e5;
    background: #fff;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    transition: all 0.15s ease;
  }
  .score-btn:hover {
    border-color: #000;
    background: #000;
    color: #fff;
  }
  .score-btn.selected {
    background: #000;
    color: #fff;
    border-color: #000;
  }
  textarea {
    width: 100%;
    padding: 16px;
    border: 2px solid #e5e5e5;
    border-radius: 16px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    min-height: 100px;
    transition: border-color 0.15s ease;
    background: #fafafa;
    line-height: 1.6;
  }
  textarea:focus {
    outline: none;
    border-color: #000;
    background: #fff;
  }
  textarea::placeholder {
    color: #999;
  }
  .field {
    margin-bottom: 28px;
  }
  .submit-btn {
    width: 100%;
    padding: 18px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: -0.3px;
  }
  .submit-btn:hover {
    background: #333;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .submit-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .result {
    margin-top: 24px;
    padding: 20px;
    border-radius: 16px;
    text-align: center;
    font-size: 15px;
    font-weight: 500;
  }
  .result.success {
    background: #f0fdf4;
    color: #166534;
    border: 1px solid #bbf7d0;
  }
  .result.error {
    background: #fef2f2;
    color: #991b1b;
    border: 1px solid #fecaca;
  }
  .hint {
    color: #999;
    font-size: 12px;
    margin-top: 8px;
    text-align: right;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title-row">
      <div class="title-icon">★</div>
      <h1>评价回复</h1>
    </div>
    <div class="meta">
      <span class="meta-tag" id="conv_id">-</span>
      <span class="meta-tag" id="category">-</span>
    </div>
  </div>

  <div class="field">
    <div class="field-label">评分</div>
    <div class="score-row" id="score_group">
      <button class="score-btn" data-score="0">0</button>
      <button class="score-btn" data-score="1">1</button>
      <button class="score-btn" data-score="2">2</button>
      <button class="score-btn" data-score="3">3</button>
      <button class="score-btn" data-score="4">4</button>
      <button class="score-btn" data-score="5">5</button>
      <button class="score-btn" data-score="6">6</button>
      <button class="score-btn" data-score="7">7</button>
      <button class="score-btn" data-score="8">8</button>
      <button class="score-btn" data-score="9">9</button>
      <button class="score-btn" data-score="10">10</button>
    </div>
    <div class="hint">0 = 错误，10 = 完美</div>
  </div>

  <input type="hidden" id="score" value="7">

  <div class="field">
    <div class="field-label">正确回复 <span style="font-weight:400;color:#999">(选填)</span></div>
    <textarea id="correct_reply" rows="3" placeholder="如果回复不对，写出正确的回复..."></textarea>
  </div>

  <div class="field">
    <div class="field-label">修改建议 <span style="font-weight:400;color:#999">(选填)</span></div>
    <textarea id="suggestion" rows="3" placeholder="对流程或内容的修改建议..."></textarea>
  </div>

  <button class="submit-btn" id="submit_btn">提交</button>
  <div id="result"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const convId = params.get('conv') || '';
const category = params.get('category') || '';

document.getElementById('conv_id').textContent = convId || '-';
document.getElementById('category').textContent = category || '-';

let selectedScore = 7;
document.querySelectorAll('.score-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedScore = parseInt(btn.dataset.score);
    document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('score').value = selectedScore;
  });
});
document.querySelector('.score-btn[data-score="7"]').classList.add('selected');

document.getElementById('submit_btn').addEventListener('click', async () => {
  const btn = document.getElementById('submit_btn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const resp = await fetch('/feedback/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversation_id: convId,
        category: category,
        score: selectedScore,
        correct_reply: document.getElementById('correct_reply').value,
        suggestion: document.getElementById('suggestion').value,
      })
    });
    const data = await resp.json();
    if (data.status === 'ok') {
      document.getElementById('result').innerHTML = '<div class="result success">已提交</div>';
      document.getElementById('submit_btn').style.display = 'none';
    } else {
      document.getElementById('result').innerHTML = '<div class="result error">提交失败</div>';
      btn.disabled = false;
      btn.textContent = '提交';
    }
  } catch(e) {
    document.getElementById('result').innerHTML = '<div class="result error">连接失败</div>';
    btn.disabled = false;
    btn.textContent = '提交';
  }
});
</script>
</body>
</html>
