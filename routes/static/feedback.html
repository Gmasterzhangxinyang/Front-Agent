<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评价 AI 回复</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 2px rgba(0,0,0,0.04);
  }
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header-icon {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    font-size: 24px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    color: #1d1d1f;
    letter-spacing: -0.3px;
  }
  .meta {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }
  .meta-tag {
    background: #f5f5f7;
    color: #86868b;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: 'SF Mono', monospace;
  }
  .disclaimer {
    background: #fef9e7;
    color: #8b6914;
    font-size: 13px;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .field {
    margin-bottom: 24px;
  }
  .field-label {
    font-size: 13px;
    font-weight: 500;
    color: #1d1d1f;
    margin-bottom: 10px;
    display: block;
  }
  .score-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .score-btn {
    width: 44px;
    height: 40px;
    border: 1.5px solid #e5e5e7;
    background: #fff;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    color: #1d1d1f;
    transition: all 0.15s ease;
  }
  .score-btn:hover {
    border-color: #667eea;
    background: #f8f7ff;
  }
  .score-btn.selected {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
  }
  textarea {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #e5e5e7;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    min-height: 100px;
    transition: border-color 0.15s ease;
    background: #fafafa;
  }
  textarea:focus {
    outline: none;
    border-color: #667eea;
    background: #fff;
  }
  textarea::placeholder {
    color: #86868b;
  }
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 8px;
  }
  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
  }
  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
  }
  .result.success {
    background: #dcfce7;
    color: #166534;
  }
  .result.error {
    background: #fee2e2;
    color: #991b1b;
  }
  .rating-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    padding: 0 4px;
  }
  .rating-labels span {
    font-size: 11px;
    color: #86868b;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-icon">⭐</div>
    <h1>评价 AI 回复</h1>
    <div class="meta">
      <span class="meta-tag" id="conv_id">-</span>
      <span class="meta-tag" id="category">-</span>
    </div>
  </div>

  <div class="disclaimer">💡 评分标准：0-3 分 = 回答有误或不全，4-6 分 = 基本正确但可改进，7-10 分 = 满足要求</div>

  <div class="field">
    <label class="field-label">评分（0-10）</label>
    <div class="score-row" id="score_group">
      <button class="score-btn" data-score="0">0</button>
      <button class="score-btn" data-score="1">1</button>
      <button class="score-btn" data-score="2">2</button>
      <button class="score-btn" data-score="3">3</button>
      <button class="score-btn" data-score="4">4</button>
      <button class="score-btn" data-score="5">5</button>
      <button class="score-btn" data-score="6">6</button>
      <button class="score-btn" data-score="7">7</button>
      <button class="score-btn" data-score="8">8</button>
      <button class="score-btn" data-score="9">9</button>
      <button class="score-btn" data-score="10">10</button>
    </div>
    <div class="rating-labels">
      <span>有误</span>
      <span>一般</span>
      <span>完美</span>
    </div>
  </div>

  <input type="hidden" id="score" value="7">

  <div class="field">
    <label class="field-label">正确回复（选填）</label>
    <textarea id="correct_reply" rows="3" placeholder="如果 AI 回复不对，这里写正确的回复..."></textarea>
  </div>

  <div class="field">
    <label class="field-label">修改建议（选填）</label>
    <textarea id="suggestion" rows="3" placeholder="对 skill 内容或流程的修改建议..."></textarea>
  </div>

  <button class="submit-btn" id="submit_btn">提交评价</button>
  <div id="result"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const convId = params.get('conv') || '';
const category = params.get('category') || '';

document.getElementById('conv_id').textContent = convId || '-';
document.getElementById('category').textContent = category || '-';

// Score buttons
let selectedScore = 7;
document.querySelectorAll('.score-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedScore = parseInt(btn.dataset.score);
    document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('score').value = selectedScore;
  });
});
// Select default 7
document.querySelector('.score-btn[data-score="7"]').classList.add('selected');

document.getElementById('submit_btn').addEventListener('click', async () => {
  const btn = document.getElementById('submit_btn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const resp = await fetch('/feedback/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversation_id: convId,
        category: category,
        score: selectedScore,
        correct_reply: document.getElementById('correct_reply').value,
        suggestion: document.getElementById('suggestion').value,
      })
    });
    const data = await resp.json();
    if (data.status === 'ok') {
      document.getElementById('result').innerHTML = '<div class="result success">✅ 评价已提交！系统将分析并生成修改建议。</div>';
      document.getElementById('submit_btn').style.display = 'none';
    } else {
      document.getElementById('result').innerHTML = '<div class="result error">❌ 提交失败：' + (data.message || '未知错误') + '</div>';
      btn.disabled = false;
      btn.textContent = '提交评价';
    }
  } catch(e) {
    document.getElementById('result').innerHTML = '<div class="result error">❌ 无法连接后端服务</div>';
    btn.disabled = false;
    btn.textContent = '提交评价';
  }
});
</script>
</body>
</html>
