<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · Front-Agent Ops</title>
<style>
  :root {
    color-scheme:light;
    --bg:#f4f5f7; --panel:#fff; --line:#dfe3e8; --text:#171a21;
    --muted:#69707d; --blue:#2563eb; --blue-hover:#1d4ed8; --red:#b42318;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .login {
    width:min(100%,400px); padding:30px; background:var(--panel);
    border:1px solid var(--line); border-radius:10px;
    box-shadow:0 16px 38px rgba(23,26,33,.08);
  }
  .brand { display:flex; align-items:center; gap:11px; margin-bottom:26px; }
  .mark {
    width:36px; height:36px; display:grid; place-items:center; border-radius:7px;
    background:#171a21; color:#fff; font-size:13px; font-weight:750;
  }
  .brand-title { font-size:16px; font-weight:720; }
  .brand-sub { margin-top:2px; color:var(--muted); font-size:12px; }
  h1 { margin:0 0 7px; font-size:22px; }
  .intro { margin:0 0 24px; color:var(--muted); font-size:13px; }
  label { display:block; margin:14px 0 6px; font-size:13px; font-weight:650; }
  input {
    width:100%; min-height:42px; padding:9px 11px; border:1px solid #cdd3dc;
    border-radius:6px; background:#fff; color:var(--text); font:inherit; outline:none;
  }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
  button {
    width:100%; min-height:42px; margin-top:20px; border:0; border-radius:6px;
    background:var(--blue); color:#fff; cursor:pointer; font:inherit; font-weight:680;
  }
  button:hover { background:var(--blue-hover); }
  button:disabled { cursor:wait; opacity:.68; }
  .error { min-height:20px; margin-top:12px; color:var(--red); font-size:12px; }
  .foot { margin-top:20px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
</style>
</head>
<body>
  <main class="login">
    <div class="brand">
      <div class="mark">FA</div>
      <div><div class="brand-title">Front-Agent</div><div class="brand-sub">Operations</div></div>
    </div>
    <h1>管理员登录</h1>
    <p class="intro">登录后查看客户会话、自动化状态和运营数据。</p>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登录</button>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
    </form>
    <div class="foot">会话仅保存在安全的 HttpOnly Cookie 中。</div>
  </main>
<script>
const form=document.getElementById('login-form');
const submit=document.getElementById('submit');
const errorBox=document.getElementById('error');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  submit.disabled=true;
  errorBox.textContent='';
  try{
    const response=await fetch('/ops/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:document.getElementById('username').value,
        password:document.getElementById('password').value
      })
    });
    if(response.ok){
      window.location.replace('/ops');
      return;
    }
    let message=response.status===429?'登录尝试过多，请稍后再试。':'用户名或密码错误。';
    try{
      const body=await response.json();
      if(body.detail)message=body.detail;
    }catch(_error){}
    errorBox.textContent=message;
  }catch(_error){
    errorBox.textContent='暂时无法连接服务，请稍后重试。';
  }finally{
    submit.disabled=false;
  }
});
</script>
</body>
</html>
