<title>Front-Agent · Neural Flow</title>
<style>
:root{--cyan:#4df4ff;--blue:#4388ff;--violet:#a46cff;--green:#53f6a6;--amber:#ffca65;--red:#ff5f77;--ink:#dff7ff;--muted:#6f91aa}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030912;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 46%,rgba(24,100,157,.12),transparent 35%),radial-gradient(circle at 80% 18%,rgba(139,74,255,.08),transparent 25%),linear-gradient(180deg,#06101e,#02060d);pointer-events:none}#neural{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}.scan{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.22;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(111,206,255,.035) 4px);mix-blend-mode:screen}.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 180px 55px rgba(0,0,0,.72)}.hud{position:fixed;left:0;right:0;top:0;height:94px;padding:20px 28px;display:flex;align-items:flex-start;justify-content:space-between;z-index:5;background:linear-gradient(180deg,rgba(2,7,14,.88),transparent);pointer-events:none}.identity{display:flex;gap:13px;align-items:center}.sigil{width:42px;height:42px;border:1px solid rgba(77,244,255,.45);display:grid;place-items:center;position:relative;transform:rotate(45deg);box-shadow:0 0 28px rgba(77,244,255,.12),inset 0 0 18px rgba(77,244,255,.08)}.sigil:before,.sigil:after{content:"";position:absolute;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}.sigil:before{width:18px;height:1px}.sigil:after{width:1px;height:18px}.sigil i{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px var(--cyan)}.brand{padding-top:1px}.brand strong{display:block;font-size:13px;letter-spacing:.22em}.brand span{display:block;color:#55758d;font-size:9px;letter-spacing:.18em;margin-top:5px}.telemetry{display:flex;gap:9px;pointer-events:auto}.metric{min-width:104px;padding:8px 11px;border:1px solid rgba(92,144,179,.18);background:linear-gradient(135deg,rgba(11,27,45,.68),rgba(6,16,29,.55));clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);backdrop-filter:blur(9px)}.metric label{display:block;color:#567891;font-size:8px;letter-spacing:.14em;text-transform:uppercase}.metric b{font:600 18px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#dffcff;text-shadow:0 0 12px rgba(77,244,255,.35)}.metric small{display:block;color:#3d6078;font-size:8px;margin-top:2px}.status{display:flex;align-items:center;gap:7px;margin-left:4px;padding:9px 12px;border:1px solid rgba(83,246,166,.2);background:rgba(7,24,26,.52);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}.status i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:breathe 1.6s infinite}.status span{font-size:9px;letter-spacing:.1em;color:#70b996}.status.bad{border-color:rgba(255,95,119,.32)}.status.bad i{background:var(--red);box-shadow:0 0 12px var(--red)}.status.bad span{color:#dc8290}.nav{position:fixed;left:28px;bottom:23px;z-index:5;display:flex;gap:8px}.nav a,.nav button{pointer-events:auto;border:1px solid rgba(83,124,153,.22);background:rgba(5,15,27,.66);color:#63839a;padding:8px 11px;text-decoration:none;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}.nav a:hover,.nav button:hover{color:var(--cyan);border-color:rgba(77,244,255,.42)}.guide{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none}.guide .line{width:140px;height:1px;margin:auto;background:linear-gradient(90deg,transparent,rgba(77,244,255,.5),transparent)}.guide span{display:block;color:#45657d;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;margin-top:7px}.signal{position:fixed;right:28px;bottom:23px;z-index:5;width:285px;pointer-events:none}.signal-head{display:flex;align-items:center;justify-content:space-between;color:#496b82;font:8px ui-monospace,SFMono-Regular,Menlo,monospace;l
@media(max-width:900px){.hud{padding:16px}.telemetry .metric:nth-child(n+3){display:none}.signal{display:none}.nav{left:16px}.panel{right:12px;width:min(340px,calc(100vw - 24px))}.guide{bottom:70px}}
@media(max-width:560px){.telemetry .metric{display:none}.hud{height:75px}.brand strong{font-size:11px}.brand span{font-size:7px}.status{padding:7px 9px}.nav{bottom:14px}.guide{display:none}}
@media(prefers-reduced-motion:reduce){.status i{animation:none}}
</style>
</head>
<body>
<canvas id="neural" aria-label="Front-Agent animated neural system flow"></canvas><div class="scan"></div><div class="vignette"></div>
<header class="hud"><div class="identity"><div class="sigil"><i></i></div><div class="brand"><strong>FRONT-AGENT / NEURAL FLOW</strong><span>LIVE SUPPORT AUTOMATION TOPOLOGY</span></div></div><div class="telemetry"><div class="metric"><label>24H SIGNALS</label><b id="m-webhooks">—</b><small>trusted ingress</small></div><div class="metric"><label>24H ACTIONS</label><b id="m-actions">—</b><small>safe effects</small></div><div class="metric"><label>CONTEXT</label><b id="m-context">—</b><small>tracked cases</small></div><div class="metric"><label>RECOVERY</label><b id="m-recovery">—</b><small>queue / dead</small></div><div class="status" id="status"><i></i><span id="status-text">CONNECTING</span></div></div></header>
<div class="nav"><a href="/ops">← OPS</a><button id="refresh" type="button">SYNC NOW</button></div><div class="guide"><div class="line"></div><span>CLICK A NEURAL CORE TO INSPECT</span></div><div class="signal"><div class="signal-head"><span>LIVE SIGNAL</span><span id="signal-time">—</span></div><div class="signal-body"><b id="signal-title">WAITING FOR TELEMETRY</b><span id="signal-detail">The network will illuminate recorded activity</span></div></div>
<aside class="panel" id="panel"><div class="panel-in"><button class="panel-close" id="panel-close">×</button><div class="panel-code" id="panel-code">CORE / 01</div><h2 id="panel-title">可信入口</h2><div class="panel-desc" id="panel-desc"></div><div class="panel-count"><span id="panel-note">LIVE COUNT</span><b id="panel-count">—</b></div><ul id="panel-rules"></ul><div class="panel-activity"><label>RECENT ACTIVITY</label><div id="panel-events"></div></div></div></aside><div class="error" id="error"></div>
<script>
const META={
ingress:{code:'CORE / 01',label:'来信',en:'INGRESS',title:'可信入口',desc:'Front 事件进入系统，先验证来源与类型，再建立可信 conversation 上下文。',note:'24H WEBHOOKS',rules:['验证 Front Webhook 签名','过滤内部转发、自身回复与无关事件','失败真实返回，不伪装处理成功']},
durable:{code:'CORE / 02',label:'接入',en:'DURABLE',title:'持久化接入',desc:'认证事件先落入持久化队列，再开始处理；进程中断后仍可恢复。',note:'PROCESSED',rules:['event_id 防止重复投递','processing 租约过期后可安全重领','retry 退避，耗尽进入 dead letter']},
context:{code:'CORE / 03',label:'上下文',en:'CONTEXT',title:'完整上下文',desc:'同时读取当前会话、附件、已保存状态和同一发件人的其他近期会话。',note:'24H CASES',rules:['最多关联 5 个其他近期会话','未发送草稿不视为历史事实','附件有来源、类型、数量和大小边界']},
classify:{code:'CORE / 04',label:'判断',en:'DECISION',title:'分类与路由',desc:'明确场景先由确定性规则识别，其余由 AI 在受限分类空间中判断。',note:'24H DECISIONS',rules:['新会话 ID 不代表新案例','封禁等明确场景确定性识别优先','低置信与敏感案例进入人工路径']},
policy:{code:'CORE / 05',label:'规则',en:'POLICY',title:'技能与策略',desc:'加载对应业务 Skill，并执行模板、语言、账号身份和专项政策校验。',note:'24H CHECKS',rules:['SaaS 回复先提供完整英文版','正文无手写落款，Front 自动签名','封禁、VAT 与账号核验有专项硬规则']},
execute:{code:'CORE / 06',label:'执行',en:'EXECUTE',title:'安全工具执行',desc:'只允许白名单工具；可信会话和收件人由运行时重绑，所有副作用防重复。',note:'24H ACTIONS',rules:['客户邮件只创建草稿，不自动发送','模型参数受可信运行时约束','失败结果不会被推进为成功状态']},
front_draft:{code:'OUTPUT / A',label:'草稿',en:'DRAFT',title:'Front 草稿',desc:'生成供人工审核的客户回复，并由 Front 添加默认签名。',note:'24H DRAFTS',rules:['英文优先，必要时附本地语言译文','正文安全转换为 HTML','草稿不会进入已发送历史']},
linear:{code:'OUTPUT / B',label:'工单',en:'LINEAR',title:'Linear 工单',desc:'为需要持续跟踪的问题创建内部工单并保存真实链接。',note:'24H TICKETS',rules:['相同问题在时间窗内去重','禁止占位工单链接','内部工单信息不写入客户回复']},
front_other:{code:'OUTPUT / C',label:'内部',en:'HANDOFF',title:'内部处理',desc:'执行评论、转交、移动、飞书通知与内部队列操作。',note:'24H HANDOFFS',rules:['内部评论对客户不可见','跨会话评论只保留必要链接','人工或工单处理后保持会话打开']},
persist:{code:'MEMORY / 08',label:'状态',en:'MEMORY',title:'状态与审计',desc:'保存分类、步骤、等待信息和动作结果，让后续来信从真实状态继续。',note:'24H STATES',rules:['动作日志提供幂等与审计','人工复核进入 Ops 优先队列','状态不会掩盖外部失败']},
recovery:{code:'LOOP / R',label:'恢复',en:'RECOVERY',title:'失败恢复',desc:'临时失败自动重试；无法安全自动处理时重新打开会话并交给人工。',note:'QUEUE / DEAD',rules:['调度器按退避时间重试','失败会 reopen Front 会话','死信与 failed_needs_review 始终可见']}
};
const NODE_DEF=[
{id:'ingress',x:.075,y:.43,r:25,c:'#4df4ff'},{id:'durable',x:.205,y:.43,r:29,c:'#43b8ff'},{id:'context',x:.345,y:.43,r:36,c:'#8f75ff'},{id:'classify',x:.49,y:.43,r:43,c:'#f5b95e'},{id:'policy',x:.625,y:.43,r:34,c:'#53f6a6'},{id:'execute',x:.755,y:.43,r:39,c:'#4df4ff'},
{id:'front_draft',x:.895,y:.24,r:27,c:'#55a2ff'},{id:'linear',x:.925,y:.43,r:25,c:'#a46cff'},{id:'front_other',x:.895,y:.62,r:27,c:'#52d5c4'},{id:'persist',x:.73,y:.76,r:32,c:'#53f6a6'},{id:'recovery',x:.43,y:.76,r:29,c:'#ff5f77'}];
const EDGE_DEF=[['ingress','durable',0,'main'],['durable','context',0,'main'],['context','classify',0,'main'],['classify','policy',0,'main'],['policy','execute',0,'main'],['execute','front_draft',-38,'branch'],['execute','linear',0,'branch'],['execute','front_other',38,'branch'],['front_draft','persist',70,'return'],['linear','persist',40,'return'],['front_other','persist',-18,'return'],['durable','recovery',90,'fail'],['execute','recovery',-65,'fail'],['recovery','durable',-120,'retry']];
const state={data:null,nodes:[],edges:[],neurons:[],mouse:{x:0,y:0,active:false},hover:null,selected:null,activityIndex:0,lastSignal:null};const canvas=document.getElementById('neural'),ctx=canvas.getContext('2d',{alpha:false});let W=0,H=0,DPR=1,start=performance.now();const $=id=>document.getElementById(id);const n=v=>Number(v||0).toLocaleString();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hex(rgb,a){const v=rgb.replace('#','');return`rgba(${parseInt(v.slice(0,2),16)},${parseInt(v.slice(2,4),16)},${parseInt(v.slice(4,6),16)},${a})`}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;if(!state.mouse.active)state.mouse={x:W/2,y:H/2,active:false};canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();seedNeurons()}
function layout(){const top=W<700?105:118,bottom=W<700?95:80,usable=Math.max(360,H-top-bottom);state.nodes=NODE_DEF.map(d=>({...d,px:d.x*W,py:top+d.y*usable,baseR:d.r*Math.max(.72,Math.min(1.12,W/1400)),flash:0}));state.edges=EDGE_DEF.map((d,i)=>({from:d[0],to:d[1],bend:d[2],kind:d[3],phase:i*.137}))}
function seedNeurons(){const count=Math.max(55,Math.min(130,Math.floor(W*H/13000)));state.neurons=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.11,vy:(Math.random()-.5)*.11,z:.25+Math.random()*.75,p:Math.random()*6.28}))}
function node(id){return state.nodes.find(x=>x.id===id)}
function dataFor(id){const d=state.data?.nodes||{};if(id==='front_other')return{count:Number(d.front_other?.count||0)+Number(d.notify?.count||0)};return d[id]||{}}
function qpoint(e,t){const a=node(e.from),b=node(e.to),mx=(a.px+b.px)/2,my=(a.py+b.py)/2+e.bend;const u=1-t;return{x:u*u*a.px+2*u*t*mx+t*t*b.px,y:u*u*a.py+2*u*t*my+t*t*b.py}}
function drawBackdrop(time){const g=ctx.createRadialGradient(W*.5,H*.46,10,W*.5,H*.46,Math.max(W,H)*.72);g.addColorStop(0,'#07182a');g.addColorStop(.48,'#04101e');g.addColorStop(1,'#01050b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.16;ctx.strokeStyle='#14314a';ctx.lineWidth=.5;const gap=44;for(let x=(time*.004)%gap;x<W;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(time*.002)%gap;y<H;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}
function drawNeuralField(time){const mx=(state.mouse.x-W/2)*.008,my=(state.mouse.y-H/2)*.008;for(const p of state.neurons){p.x+=p.vx;p.y+=p.vy;if(p.x<-30)p.x=W+30;if(p.x>W+30)p.x=-30;if(p.y<-30)p.y=H+30;if(p.y>H+30)p.y=-30}ctx.save();for(let i=0;i<state.neurons.length;i++){const a=state.neurons[i],ax=a.x+mx*a.z,ay=a.y+my*a.z;for(let j=i+1;j<state.neurons.length;j++){const b=state.neurons[j],bx=b.x+mx*b.z,by=b.y+my*b.z,dx=ax-bx,dy=ay-by,dist=Math.hypot(dx,dy);if(dist<105){ctx.strokeStyle=`rgba(56,139,184,${(1-dist/105)*.12*Math.min(a.z,b.z)})`;ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke()}}const pulse=.5+.5*Math.sin(time*.0012+a.p);ctx.fillStyle=`rgba(75,194,225,${(.1+.18*pulse)*a.z})`;ctx.beginPath();ctx.arc(ax,ay,.7+1.15*a.z,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawEdge(e,time){const color=e.kind==='fail'?'#ff5f77':e.kind==='retry'?'#a46cff':e.kind==='branch'?'#5fb7ff':e.kind==='return'?'#48cfa5':'#4df4ff';ctx.save();ctx.beginPath();for(let i=0;i<=32;i++){const p=qpoint(e,i/32);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle=hex(color,e.kind==='fail'||e.kind==='retry'?.23:.19);ctx.lineWidth=e.kind==='main'?1.4:1;if(e.kind==='fail'||e.kind==='retry')ctx.setLineDash([5,8]);ctx.shadowColor=color;ctx.shadowBlur=e.kind==='main'?8:4;ctx.stroke();ctx.setLineDash([]);const speed=e.kind==='main'?.000105:.000075;const t=(time*speed+e.phase)%1,p=qpoint(e,t),tail=qpoint(e,Math.max(0,t-.035));const grad=ctx.createLinearGradient(tail.x,tail.y,p.x,p.y);grad.addColorStop(0,hex(color,0));grad.addColorStop(1,hex(color,.95));ctx.strokeStyle=grad;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(tail.x,tail.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.fillStyle='#fff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(p.x,p.y,e.kind==='main'?2.4:1.8,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawOrbit(nd,time,intensity){const r=nd.baseR,hover=state.hover===nd.id||state.selected===nd.id;ctx.save();ctx.translate(nd.px,nd.py);ctx.rotate(time*.00018*(nd.id==='classify'?-1:1));ctx.strokeStyle=hex(nd.c,.18+(hover?.22:0));ctx.lineWidth=1;ctx.setLineDash([Math.max(5,r*.38),Math.max(7,r*.28)]);ctx.beginPath();ctx.arc(0,0,r*1.55,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.rotate(-time*.00042);ctx.strokeStyle=hex(nd.c,.1+(intensity*.1));ctx.beginPath();ctx.arc(0,0,r*1.9,0,Math.PI*1.35);ctx.stroke();for(let i=0;i<(nd.id==='context'?5:nd.id==='classify'?4:2);i++){const a=time*.00035+i*Math.PI*2/(nd.id==='context'?5:4),rr=r*(1.55+(i%2)*.35);ctx.fillStyle=hex(nd.c,.55);ctx.shadowColor=nd.c;ctx.shadowBlur=7;ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,1.4,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawCore(nd,time){const d=dataFor(nd.id),count=Number(d.count||0),hover=state.hover===nd.id,selected=state.selected===nd.id,active=nd.flash>time,pulse=1+Math.sin(time*.0023+nd.x*9)*.035+(active?.18:0),r=nd.baseR*pulse;drawOrbit(nd,time,Math.min(1,count/10));ctx.save();const glow=ctx.createRadialGradient(nd.px,nd.py,0,nd.px,nd.py,r*2.6);glow.addColorStop(0,hex(nd.c,active?.4:.24));glow.addColorStop(.35,hex(nd.c,active?.13:.075));glow.addColorStop(1,hex(nd.c,0));ctx.fillStyle=glow;ctx.beginPath();ctx.arc(nd.px,nd.py,r*2.6,0,Math.PI*2);ctx.fill();const shell=ctx.createRadialGradient(nd.px-r*.28,nd.py-r*.3,r*.08,nd.px,nd.py,r);shell.addColorStop(0,'rgba(235,253,255,.96)');shell.addColorStop(.12,hex(nd.c,.95));shell.addColorStop(.46,hex(nd.c,.22));shell.addColorStop(.72,'rgba(3,15,27,.94)');shell.addColorStop(1,hex(nd.c,.5));ctx.fillStyle=shell;ctx.shadowColor=nd.c;ctx.shadowBlur=active?32:hover||selected?24:15;ctx.beginPath();ctx.arc(nd.px,nd.py,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=hex(nd.c,selected?.95:hover?.7:.4);ctx.lineWidth=selected?2:1;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.9)';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(nd.px-r*.27,nd.py-r*.3,Math.max(1.3,r*.08),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.textAlign='center';ctx.fillStyle=hover||selected?'#eaffff':'#8bb4c8';ctx.font=`${hover||selected?600:500} ${Math.max(9,Math.min(12,W/120))}px ui-monospace,monospace`;ctx.fillText(META[nd.id].en,nd.px,nd.py+r*2.35);ctx.fillStyle=hex(nd.c,hover||selected?.95:.64);ctx.font=`500 ${Math.max(8,Math.min(10,W/145))}px sans-serif`;ctx.fillText(META[nd.id].label,nd.px,nd.py+r*2.35+15);if(count){ctx.fillStyle=hex(nd.c,.48);ctx.font='9px ui-monospace,monospace';ctx.fillText(n(count),nd.px,nd.py-r*1.75)}ctx.restore()}
function frame(now){drawBackdrop(now);drawNeuralField(now);for(const e of state.edges)drawEdge(e,now);for(const nd of state.nodes)drawCore(nd,now);requestAnimationFrame(frame)}
function nearest(x,y){let best=null,dist=Infinity;for(const nd of state.nodes){const d=Math.hypot(x-nd.px,y-nd.py);if(d<nd.baseR*2.1&&d<dist){best=nd;dist=d}}return best}
function showPanel(id){state.selected=id;const m=META[id],d=dataFor(id);$('panel-code').textContent=m.code;$('panel-title').textContent=m.title;$('panel-desc').textContent=m.desc;$('panel-note').textContent=m.note;$('panel-count').textContent=n(d.count);$('panel-rules').innerHTML=m.rules.map(x=>`<li>${esc(x)}</li>`).join('');const events=(state.data?.recent_activity||[]).filter(x=>x.node===id||(id==='front_other'&&x.node==='notify')).slice(0,4);$('panel-events').innerHTML=events.length?events.map(x=>`<div class="mini"><a href="${esc(x.front_url)}" target="_blank" rel="noreferrer">${esc(x.conversation_id)}</a><span>${esc(x.title)}</span></div>`).join(''):'<div class="mini"><span>NO RECENT SIGNAL</span></div>';$('panel').classList.add('open')}
function updateSignal(){const items=state.data?.recent_activity||[];if(!items.length)return;const event=items[state.activityIndex%Math.min(items.length,24)];state.activityIndex++;let id=event.node;if(id==='notify')id='front_other';const nd=node(id);if(nd)nd.flash=performance.now()+1050;$('signal-title').textContent=event.title.toUpperCase();$('signal-detail').textContent=`${event.conversation_id}  ·  ${META[id]?.en||id}`;$('signal-time').textContent=new Date(event.occurred_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function renderTelemetry(){const d=state.data,nodes=d.nodes;$('m-webhooks').textContent=n(nodes.ingress?.count);$('m-actions').textContent=n(nodes.execute?.count);$('m-context').textContent=n(nodes.context?.count);$('m-recovery').textContent=`${n(nodes.recovery?.count)} / ${n(nodes.recovery?.dead_letters)}`;$('status').classList.toggle('bad',d.service?.status!=='ok');$('status-text').textContent=d.service?.status==='ok'?'SYSTEM NOMINAL':'ATTENTION REQUIRED';if(state.selected)showPanel(state.selected)}
async function load(){try{const r=await fetch('/ops/api/system-flow',{cache:'no-store'});if(r.status===401){location.replace('/ops/login');return}if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);state.data=await r.json();$('error').classList.remove('show');renderTelemetry();if(!state.lastSignal){state.lastSignal=true;updateSignal()}}catch(e){$('error').textContent=`TELEMETRY LINK FAILED / ${e.message}`;$('error').classList.add('show');$('status').classList.add('bad');$('status-text').textContent='LINK DEGRADED'}}
canvas.addEventListener('pointermove',e=>{state.mouse={x:e.clientX,y:e.clientY,active:true};const nd=nearest(e.clientX,e.clientY);state.hover=nd?.id||null;canvas.style.cursor=nd?'pointer':'crosshair'});canvas.addEventListener('pointerleave',()=>{state.mouse.active=false;state.hover=null});canvas.addEventListener('click',e=>{const nd=nearest(e.clientX,e.clientY);if(nd)showPanel(nd.id)});$('panel-close').addEventListener('click',()=>{$('panel').classList.remove('open');state.selected=null});$('refresh').addEventListener('click',load);addEventListener('resize',resize);resize();requestAnimationFrame(frame);load();setInterval(load,8000);setInterval(updateSignal,1200);
</script>
</body>
